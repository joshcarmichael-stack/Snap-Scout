<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111f">
<title>Snap Scout</title>
<style>
  :root {
    --bg: #f4f2f8; --panel: #ffffff; --panel-2: #f0edf7; --text: #19152a; --muted: #6c6680; --line: #e1dcec;
    --accent: #6a3fe0; --accent-ink: #ffffff; --accent-soft: #ebe4ff;
    --good: #18864b; --good-soft: #def5e7; --warn: #a86400; --warn-soft: #fdf0d9; --bad: #c8312f; --bad-soft: #fde3e2;
    --energy: #2f6fe4; --power: #e07a12;
    --shadow: 0 1px 2px rgb(20 10 40 / 6%), 0 4px 16px rgb(20 10 40 / 6%);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #100d19; --panel: #1b1729; --panel-2: #241f36; --text: #eeeaf7; --muted: #9a93b0; --line: #2f2944;
      --accent: #9b7bff; --accent-ink: #14111f; --accent-soft: #2c2448;
      --good: #4fd18b; --good-soft: #15301f; --warn: #f2b44c; --warn-soft: #33270f; --bad: #ff7a73; --bad-soft: #3a1a1c;
      --energy: #5b93ff; --power: #ff9d3d;
      --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 6px 20px rgb(0 0 0 / 25%);
    }
  }
  :root[data-theme="dark"] {
    --bg: #100d19; --panel: #1b1729; --panel-2: #241f36; --text: #eeeaf7; --muted: #9a93b0; --line: #2f2944;
    --accent: #9b7bff; --accent-ink: #14111f; --accent-soft: #2c2448;
    --good: #4fd18b; --good-soft: #15301f; --warn: #f2b44c; --warn-soft: #33270f; --bad: #ff7a73; --bad-soft: #3a1a1c;
    --energy: #5b93ff; --power: #ff9d3d;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 6px 20px rgb(0 0 0 / 25%);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .tnum { font-variant-numeric: tabular-nums; }

  /* Header */
  header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); padding: calc(env(safe-area-inset-top) + 8px) 16px 8px; }
  .hdr { max-width: 760px; margin: 0 auto; display: flex; align-items: center; gap: 6px; min-height: 40px; }
  .brand { font-weight: 800; letter-spacing: -.01em; margin-right: auto; font-size: 16px; }
  .stat { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; height: 40px; }
  .stat button { width: 30px; height: 100%; border: 0; background: none; color: var(--muted); font-size: 18px; }
  .stat .val { min-width: 34px; text-align: center; line-height: 1.05; }
  .stat .val b { display: block; font-size: 17px; }
  .stat .val small { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .stat .val small.auto::after { content: " ·auto"; }
  .stat.energy b { color: var(--energy); }
  .icon-btn { height: 40px; width: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); font-size: 17px; }

  main { max-width: 760px; margin: 0 auto; padding: 12px 16px calc(env(safe-area-inset-bottom) + 110px); }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 20px 2px 8px; display: flex; align-items: baseline; gap: 8px; }
  h2 .right { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 12px; }
  .banner { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 600; margin-bottom: 8px; }

  /* Lanes */
  .lanes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .lane { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
  .loc { position: relative; border: 0; padding: 0; background: var(--panel-2); min-height: 64px; text-align: left; display: block; width: 100%; overflow: hidden; }
  .loc img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
  .loc .loc-txt { position: relative; padding: 8px 8px 6px; background: linear-gradient(to top, color-mix(in srgb, var(--panel) 92%, transparent) 30%, transparent); min-height: 64px; display: flex; flex-direction: column; justify-content: flex-end; }
  .loc .loc-name { font-weight: 700; font-size: 13px; line-height: 1.15; }
  .loc .loc-empty { color: var(--muted); font-size: 12px; }
  .loc-fx { font-size: 11px; color: var(--muted); padding: 6px 8px 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .badge { display: inline-block; font-size: 10px; font-weight: 700; border-radius: 6px; padding: 1px 5px; }
  .badge.modelled { background: var(--good-soft); color: var(--good); }
  .badge.approx { background: var(--warn-soft); color: var(--warn); }
  .badge.symmetric, .badge.none { background: var(--panel-2); color: var(--muted); }
  .side { padding: 8px 8px 0; }
  .side label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 3px; }
  .pw { display: flex; align-items: stretch; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg); height: 40px; }
  .pw button { width: 28px; border: 0; background: none; color: var(--muted); font-size: 17px; flex: none; }
  .pw input { width: 100%; min-width: 0; border: 0; background: none; text-align: center; font-size: 19px; font-weight: 700; padding: 0; -moz-appearance: textfield; }
  .pw input::-webkit-outer-spin-button, .pw input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .pw.opp input { color: var(--bad); }
  .pips { display: flex; gap: 4px; margin-top: 6px; }
  .pips button { flex: 1; height: 16px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); padding: 0; }
  .pips button.on { background: var(--muted); border-color: var(--muted); }
  .verdict { margin-top: 10px; padding: 8px 6px; text-align: center; font-weight: 800; font-size: 14px; line-height: 1.1; }
  .verdict small { display: block; font-weight: 600; font-size: 11px; margin-top: 2px; opacity: .85; }
  .verdict.safe { background: var(--good-soft); color: var(--good); }
  .verdict.at-risk { background: var(--warn-soft); color: var(--warn); }
  .verdict.losing { background: var(--bad-soft); color: var(--bad); }
  .verdict.closed { background: var(--panel-2); color: var(--muted); }
  .threat { padding: 6px 8px 0; font-size: 11px; color: var(--muted); line-height: 1.3; }
  .threat b { color: var(--text); }
  .threat .nm { color: var(--warn); }
  .answer { margin: 6px 8px 8px; font-size: 11px; line-height: 1.3; border-radius: 8px; padding: 5px 6px; background: var(--accent-soft); }
  .answer b { color: var(--accent); }
  .answer.short { background: var(--panel-2); color: var(--muted); }
  .lane-pad { height: 8px; }
  .lane-tools { padding: 6px 8px 0; display: flex; flex-direction: column; gap: 4px; }
  .addcard { width: 100%; min-height: 32px; border-radius: 8px; border: 1px dashed var(--line); background: none; color: var(--muted); font-size: 12px; font-weight: 600; padding: 4px; }
  .addcard.hl { border-style: solid; border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .usedchip { min-height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted); font-size: 11px; padding: 2px 4px; }
  .usedchip.on { color: var(--good); border-color: var(--good); background: var(--good-soft); }
  .extras { display: flex; flex-wrap: wrap; gap: 4px; }
  .xchip { border: 0; border-radius: 6px; font-size: 11px; font-weight: 600; padding: 3px 6px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .xchip.opp { background: var(--bad-soft); color: var(--bad); }
  .xchip.me { background: var(--good-soft); color: var(--good); }
  .seg { display: flex; background: var(--panel-2); border-radius: 10px; padding: 3px; gap: 2px; margin-bottom: 8px; }
  .seg button { flex: 1; border: 0; background: none; border-radius: 8px; height: 34px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  .fchip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; height: 30px; padding: 0 12px; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .fchip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
  .res.sel { border-color: var(--accent); background: var(--accent-soft); }
  .sheet-ft { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line); padding: 10px 16px calc(env(safe-area-inset-bottom) + 10px); display: flex; gap: 8px; align-items: center; }
  .sheet-ft .sel-name { flex: 1; min-width: 0; font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-ft label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .sheet-ft input::-webkit-outer-spin-button, .sheet-ft input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .sheet-ft input { -moz-appearance: textfield; width: 64px; height: 40px; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; text-align: center; font-size: 18px; font-weight: 700; }
  #cardList { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }

  /* Card strips */
  .strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: none; }
  .strip::-webkit-scrollbar { display: none; }
  .pcard { position: relative; flex: none; width: 58px; border: 0; padding: 0; background: none; text-align: center; }
  .pcard .art { width: 58px; height: 72px; }
  .pcard span.lbl { display: block; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .pcard i { position: absolute; top: -4px; right: -4px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); font-size: 11px; font-style: normal; line-height: 16px; color: var(--muted); }
  .mine .pcard .art { outline: 2px solid transparent; outline-offset: 1px; }
  .mine .pcard.hand .art { outline-color: var(--accent); }
  .mine .pcard.played { opacity: .35; }
  .mine .pcard.hand span.lbl { color: var(--accent); font-weight: 700; }
  .empty { color: var(--muted); font-size: 13px; padding: 10px 2px; }
  .cta { display: block; width: 100%; text-align: left; border: 1px dashed var(--line); background: var(--panel); border-radius: 12px; padding: 12px; color: var(--muted); font-size: 13px; }
  .cta b { color: var(--accent); }

  .alerts { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .alert { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px 6px 6px; font-size: 13px; }
  .alert .art { width: 36px; height: 44px; }
  .alert small { display: block; color: var(--muted); font-size: 11px; }
  .alert .p { font-weight: 800; color: var(--accent); }

  .art { position: relative; border-radius: 8px; background: var(--panel-2); overflow: hidden; display: grid; place-items: center; }
  .art img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; transform: scale(1.25); }
  .art .fallback { font-size: 10px; color: var(--muted); padding: 2px; text-align: center; }

  .search { position: sticky; top: calc(env(safe-area-inset-top) + 57px); z-index: 5; padding: 8px 0; background: var(--bg); }
  .search input, .field { width: 100%; height: 44px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 0 14px; font-size: 16px; }
  textarea.field { height: 96px; padding: 10px 14px; resize: vertical; font-size: 14px; }
  .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 8px; }
  .res { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 4px 8px 4px 4px; text-align: left; min-height: 48px; }
  .res .art { width: 32px; height: 40px; flex: none; }
  .res b { font-size: 13px; display: block; }
  .res small { color: var(--muted); font-size: 11px; }

  /* Predictions */
  .tabs { display: flex; background: var(--panel-2); border-radius: 10px; padding: 3px; gap: 2px; }
  .tabs button { flex: 1; border: 0; background: none; border-radius: 8px; height: 32px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .tabs button[aria-pressed="true"] { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }
  .hint { font-size: 12px; color: var(--muted); margin: 8px 2px; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .row { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 6px 12px 6px 6px; text-align: left; }
  .row:active { transform: scale(.99); background: var(--panel-2); }
  .row .art { width: 44px; height: 54px; }
  .nm-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .nm-line b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cp { display: inline-flex; gap: 3px; flex: none; }
  .cost, .pow { font-size: 11px; font-weight: 800; border-radius: 6px; padding: 1px 5px; color: #fff; }
  .cost { background: var(--energy); }
  .cost.mod { outline: 2px solid var(--good); outline-offset: 1px; }
  .pow { background: var(--power); }
  .sub { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; }
  .sub .nm { color: var(--warn); }
  .bar { height: 4px; background: var(--panel-2); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .big { text-align: right; }
  .big b { font-size: 18px; display: block; }
  .big small { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .more { width: 100%; margin-top: 8px; height: 44px; border: 1px dashed var(--line); background: none; border-radius: 12px; color: var(--muted); }
  footer { color: var(--muted); font-size: 11px; margin-top: 24px; line-height: 1.5; }

  /* Decks */
  .deck { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); margin-bottom: 10px; }
  .deck.active { border-color: var(--accent); }
  .deck-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .deck-hd b { font-size: 15px; }
  .deck-hd .badge { background: var(--accent); color: var(--accent-ink); }
  .mini { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; }
  .mini .art { aspect-ratio: 4 / 5; }
  .deck-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .btn { height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font-weight: 600; font-size: 14px; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.danger { color: var(--bad); }
  .slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
  .slot { border: 1px dashed var(--line); border-radius: 10px; aspect-ratio: 4 / 5; background: var(--panel); padding: 0; position: relative; overflow: hidden; }
  .slot .art { width: 100%; height: 100%; border-radius: 0; }
  .slot i { position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--panel); font-size: 11px; font-style: normal; line-height: 18px; color: var(--muted); }
  .slot-name { position: absolute; left: 0; right: 0; bottom: 0; font-size: 10px; padding: 2px 3px; background: color-mix(in srgb, var(--panel) 85%, transparent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note { font-size: 12px; color: var(--muted); margin: 6px 2px; }
  .note.err { color: var(--bad); }

  /* Bottom nav */
  nav.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 6px 16px calc(env(safe-area-inset-bottom) + 6px); }
  nav.tabbar div { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
  nav.tabbar button { flex: 1; height: 44px; border: 0; border-radius: 12px; background: none; font-weight: 700; color: var(--muted); }
  nav.tabbar button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }

  /* Toast + sheet */
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px); transform: translate(-50%, 260%); transition: transform .2s ease; z-index: 30; background: var(--text); color: var(--bg); border-radius: 12px; padding: 0 6px 0 14px; display: flex; align-items: center; gap: 10px; height: 48px; max-width: calc(100vw - 32px); box-shadow: var(--shadow); }
  .toast.show { transform: translate(-50%, 0); }
  .toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast button { border: 0; background: none; color: var(--accent); font-weight: 800; height: 40px; padding: 0 10px; }
  dialog { border: 0; padding: 0; margin: auto auto 0; width: 100%; max-width: 760px; max-height: 82vh; border-radius: 18px 18px 0 0; background: var(--panel); color: var(--text); }
  dialog::backdrop { background: rgb(0 0 0 / 45%); }
  .sheet-hd { position: sticky; top: 0; background: var(--panel); padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .sheet-hd .t { display: flex; align-items: center; margin-bottom: 10px; font-weight: 700; }
  .sheet-hd .t button { margin-left: auto; border: 0; background: none; color: var(--accent); font-weight: 700; height: 36px; }
  .sheet-hd input { width: 100%; height: 44px; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 0 14px; font-size: 16px; }
  .sheet-list { padding: 8px 16px calc(env(safe-area-inset-bottom) + 16px); display: flex; flex-direction: column; gap: 6px; }
  .lrow { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: center; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 6px; text-align: left; }
  .lrow .art { width: 48px; height: 48px; }
  .lrow b { font-size: 14px; }
  .lrow p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }


  /* Board */
  .total { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .total b { font-size: 22px; font-weight: 800; }
  .total.opp b { color: var(--bad); }
  .adj { width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-size: 14px; padding: 0; flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 4px; min-height: 30px; }
  .chip { position: relative; width: calc(25% - 3px); min-width: 0; aspect-ratio: 4 / 5; border: 0; padding: 0; border-radius: 6px; overflow: hidden; background: var(--panel-2); }
  .chip .art { width: 100%; height: 100%; border-radius: 0; }
  .chip .cpw { position: absolute; right: 1px; bottom: 1px; height: auto; border: 0; border-radius: 5px; background: var(--power); color: #fff; font-size: 10px; font-weight: 800; padding: 0 3px; min-width: 14px; text-align: center; overflow: visible; }
  .chip .cpw.up { background: var(--good); }
  .chip .cpw.down { background: var(--bad); }
  .chip.created { outline: 1px dashed var(--muted); outline-offset: -1px; }
  .lane-pct { font-size: 10px; color: var(--muted); text-align: center; margin-top: 2px; }
  .win { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); }
  .win .pct { font-size: 30px; font-weight: 800; line-height: 1; }
  .win .pct small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-top: 3px; }
  .win .call { font-weight: 800; font-size: 17px; }
  .win .why { font-size: 12px; color: var(--muted); }
  .win.good .pct, .win.good .call { color: var(--good); }
  .win.warn .pct, .win.warn .call { color: var(--warn); }
  .win.bad .pct, .win.bad .call { color: var(--bad); }
  .win.idle { color: var(--muted); font-size: 13px; display: block; }
  .watch { margin-top: 6px; display: flex; flex-direction: column; gap: 4px; }
  .watch div { font-size: 12px; background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 6px 10px; }
  .act-card { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; margin-bottom: 10px; }
  .act-card .art { width: 56px; height: 70px; }
  .act-card p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  .act-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
  .act-row .btn { height: 52px; padding: 4px; font-size: 13px; line-height: 1.15; }
  .act-row .btn small { display: block; font-weight: 500; color: var(--muted); font-size: 11px; }
  .act-row .btn.primary small { color: inherit; opacity: .8; }
  .act-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 10px 0 6px; }
  .pw-edit { display: flex; align-items: center; gap: 8px; }
  .pw-edit b { font-size: 22px; min-width: 40px; text-align: center; }

  @media (max-width: 440px) {
    .brand { display: none; }
    .hdr { justify-content: space-between; }
    .stat button { width: 28px; }
  }
  @media (min-width: 560px) {
    .verdict { font-size: 16px; }
    .loc-fx { font-size: 12px; }
  }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

    <div class="stat"><button data-step="hand:-1" aria-label="Smaller opponent hand">−</button><div class="val tnum"><b id="hand"></b><small id="handLbl">Opp hand</small></div><button data-step="hand:1" aria-label="Bigger opponent hand">+</button></div>

<dialog id="locSheet">

    <div class="t"><span id="locSheetTitle">Location</span><button id="locClear">Clear</button><button id="locClose">Done</button></div>

      <button data-cside="opp">Their side</button><button data-cside="me">My side</button><button data-cside="hand">My hand</button>
    </div>

  </div>

    <span class="sel-name" id="cardSel">Pick a card</span>
    <label for="cardPower">Power</label><input id="cardPower" type="number" inputmode="numeric">
    <button class="btn primary" id="cardAdd" disabled>Add</button>
  </div>

<script type="module">
import { Model, handProbability, nextPlayLikelihood, opponentThreat } from './model.js';
import { locationEffect, boardModifiers, laneRules, evaluateBoard, KIND_LABEL } from './locations.js';
import { parseDeck, deckCode, counterAlerts, bestAnswer, COUNTERS } from './decks.js';
import { buildBoard } from './engine.js';
import { ABILITIES } from './abilities.js';
import { winChance, snapAdvice } from './sim.js';

const ART = (file, w = 96) => (file ? `https://i0.wp.com/marvelsnapzone.com/wp-content/themes/blocksy-child/assets/media/cards/${file}?w=${w}` : '');

const [cardData, deckData, locData] = await Promise.all([
  fetch('data/cards.json').then((r) => r.json()),
  fetch('data/decks.json').then((r) => r.json()),
  fetch('data/locations.json').then((r) => r.json()),
]);
const cards = new Map(cardData.cards.map((c) => [c.id, c]));
const locations = new Map(locData.locations.map((l) => [l.id, l]));
const model = new Model(deckData.ids, deckData.decks);

// Average printed power by cost, for random-transform locations.
const avgByCost = new Map();
for (const c of cardData.cards) {
  if (c.generated) continue;
  const k = Math.min(6, c.cost);
  const a = avgByCost.get(k) || [0, 0];
  avgByCost.set(k, [a[0] + c.power, a[1] + 1]);
}
const avgPower = (cost) => { const a = avgByCost.get(Math.min(6, Math.max(0, cost))); return a ? a[0] / a[1] : 0; };

// ---- State --------------------------------------------------------------
// The game is an event log (see engine.js); lanes keep the location and any
// manual correction to the computed totals. Everything stays on this device.
const STORE = 'snap-scout-v4';
const DECKS = 'snap-scout-decks';
const freshLane = () => ({ loc: null, used: false, adjMe: 0, adjOpp: 0 });
const fresh = () => ({ turn: 1, energy: null, hand: null, events: [], mine: {}, myExtra: [], sort: 'next', showAll: false, lanes: [0, 1, 2].map(freshLane) });
let state = fresh();
let decks = { list: [], active: null };
const load = (k) => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
const s0 = load(STORE);
if (s0 && Array.isArray(s0.events)) state = { ...state, ...s0, lanes: s0.lanes.map((l) => ({ ...freshLane(), ...l })) };
const d0 = load(DECKS);
if (d0 && Array.isArray(d0.list)) decks = d0;
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(state)); localStorage.setItem(DECKS, JSON.stringify(decks)); } catch {} };
let view = 'game';
let seq = Date.now() % 100000;
const newUid = () => `e${(++seq).toString(36)}`;

const energy = () => state.energy ?? state.turn;
const oppDeckEvents = () => state.events.filter((e) => e.side === 'opp' && (e.t === 'play' || e.t === 'log'));
const myPlays = () => state.events.filter((e) => e.side === 'me' && e.t === 'play');
const handSize = () => state.hand ?? Math.max(0, Math.min(7, 3 + state.turn - oppDeckEvents().length));
const activeDeck = () => decks.list.find((d) => d.id === decks.active) || null;

// ---- Helpers ------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const pct = (p) => (p >= 0.995 ? '99%' : p < 0.01 && p > 0 ? '<1%' : `${Math.round(p * 100)}%`);
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
const artHtml = (file, alt) => `<span class="art">${file ? `<img src="${ART(file)}" alt="" loading="lazy" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'fallback',textContent:${esc(JSON.stringify(alt))}}))">` : `<span class="fallback">${esc(alt)}</span>`}</span>`;
const nameOf = (id) => cards.get(id)?.name ?? id;
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const locName = (i) => (state.lanes[i].loc && locations.get(state.lanes[i].loc)?.name) || `Location ${i + 1}`;
const abilityKind = (id) => { const a = ABILITIES[id]; if (a) return a.kind; return cards.get(id)?.special ? 'unmodelled' : 'modelled'; };
const abilityNote = (id) => ABILITIES[id]?.note || (cards.get(id)?.special ? 'Ability not modelled: printed Power only.' : 'No ability.');

// ---- Game computation --------------------------------------------------
function boardFor(events) {
  return buildBoard(events, { cards, lanes: state.lanes, turn: state.turn, avgPower });
}
function lanesFrom(board) {
  return state.lanes.map((l, i) => ({
    loc: l.loc, used: l.used,
    mine: board.lanes[i].me.power + l.adjMe, theirs: board.lanes[i].opp.power + l.adjOpp,
    myCards: board.lanes[i].me.cards, oppCards: board.lanes[i].opp.cards,
  }));
}

function compute() {
  const board = boardFor(state.events);
  const lanes = lanesFrom(board);
  const mods = boardModifiers(lanes, state.turn, avgPower);
  const seenIds = oppDeckEvents().filter((e) => !cards.get(e.id)?.generated).map((e) => e.id);
  const { probs, alpha } = model.predict(model.toIndices(seenIds));
  const seen = new Set(seenIds);
  // Energy left this turn: what's already been played this turn is spent.
  const spent = (side) => state.events.filter((e) => e.t === 'play' && e.side === side && e.turn === state.turn)
    .reduce((s, e) => s + (cards.get(e.id) ? mods.costOf(cards.get(e.id)) : 0), 0);
  const oppSpent = spent('opp'), mySpent = spent('me');
  const oppEnergy = Math.max(0, energy() + mods.oppEnergy - oppSpent);
  const myEnergy = Math.max(0, energy() + mods.myEnergy - mySpent);
  const rows = [];
  probs.forEach((p, i) => {
    const id = model.ids[i];
    const c = cards.get(id);
    if (!c || seen.has(id) || p < 0.005) return;
    const cost = mods.costOf(c);
    const pHand = handProbability(p, handSize(), seenIds.length);
    rows.push({ ...c, baseCost: c.cost, cost, power: mods.powerOf(c), pDeck: p, pHand, pNext: nextPlayLikelihood(pHand, cost, oppEnergy) });
  });

  // Threat per lane: what each likely card would really add there, with its
  // ability and the location applied by the engine.
  const pool = rows.filter((r) => r.cost <= oppEnergy && r.pHand >= 0.15).sort((a, b) => b.pNext - a.pNext).slice(0, 6);
  const gain = new Map(); // `${id}:${lane}` -> { here, swing }
  for (const r of pool) for (let lane = 0; lane < 3; lane++) {
    const b = boardFor([...state.events, { t: 'play', uid: 'what-if', side: 'opp', id: r.id, lane, turn: state.turn }]);
    const here = b.lanes[lane].opp.power - board.lanes[lane].opp.power;
    const swing = [0, 1, 2].reduce((s, i) => s + (b.lanes[i].opp.power - board.lanes[i].opp.power) - (b.lanes[i].me.power - board.lanes[i].me.power), 0);
    gain.set(`${r.id}:${lane}`, { here, swing });
  }
  const threatFor = (i) => {
    const rules = laneRules(lanes, i, state.turn, 'opp', avgPower, mods);
    const laneRows = pool.map((r) => ({ ...r, power: gain.get(`${r.id}:${i}`)?.here ?? r.power }));
    return opponentThreat(laneRows, oppEnergy, { ...rules, bonus: () => 0 });
  };
  const evals = evaluateBoard(lanes, state.turn, threatFor, avgPower);

  // Big swings to warn about (e.g. Arnim Zola on a doubled Black Panther).
  const watch = [];
  for (const r of pool) {
    let best = null;
    for (let lane = 0; lane < 3; lane++) {
      const g = gain.get(`${r.id}:${lane}`);
      const rules = laneRules(lanes, lane, state.turn, 'opp', avgPower, mods);
      if (!g || !rules.capacity || !rules.allowed(r)) continue;
      if (!best || g.swing > best.swing) best = { ...g, lane };
    }
    if (best && best.swing >= 10 && best.swing > r.power + 3) watch.push({ r, ...best });
  }
  watch.sort((a, b) => b.swing * b.r.pNext - a.swing * a.r.pNext);

  // My side.
  const deck = activeDeck();
  const playedMine = new Set(myPlays().map((e) => e.id));
  const extras = state.myExtra.filter((x) => !x.played);
  let myRows = [];
  if (deck || extras.length) {
    const deckCards = deck ? deck.cards.filter((id) => !playedMine.has(id)) : [];
    const hand = deckCards.filter((id) => state.mine[id] === 'hand');
    const pool2 = hand.length || !deck ? hand : deckCards;
    myRows = pool2.map((id) => cards.get(id)).filter(Boolean).map((c) => ({ ...c, cost: mods.costOf(c), power: mods.powerOf(c) }));
    for (const x of extras) { const c = cards.get(x.id); if (c) myRows.push({ ...c, cost: mods.costOf(c), power: x.power }); }
  }
  const answers = evals.map((b, i) => {
    if ((!deck && !extras.length) || b.status === 'safe' || b.status === 'closed' || b.scoring) return null;
    const target = b.status === 'at-risk' ? b.holdNeed : b.holdNeed || b.need;
    return bestAnswer(myRows, myEnergy, laneRules(lanes, i, state.turn, 'me', avgPower, mods), target);
  });
  return { board, lanes, rows, alpha, mods, evals, answers, watch, oppEnergy, myEnergy, oppSpent, mySpent, seenIds, playedMine };
}

// ---- Win chance (runs after render, debounced) ---------------------------
let winTimer = null, winKey = '';
function scheduleWin(c) {
  const deck = activeDeck();
  if (!deck) {
    $('winBox').innerHTML = `<div class="win idle">Add your deck in <b>My decks</b> to see your win chance and when to snap.</div>`;
    return;
  }
  const key = JSON.stringify([state.events, state.lanes, state.turn, state.energy, state.hand, state.mine, state.myExtra, decks.active]);
  if (key === winKey) return;
  winKey = key;
  clearTimeout(winTimer);
  winTimer = setTimeout(() => {
    const lastTurn = state.lanes.some((l, i) => l.loc === 'Limbo' && state.turn >= i + 1) ? 7 : c.mods.lastTurn;
    const playedMine = c.playedMine;
    const left = deck.cards.filter((id) => !playedMine.has(id));
    const handIds = left.filter((id) => state.mine[id] === 'hand');
    const myHand = [...handIds.map((id) => ({ id })), ...state.myExtra.filter((x) => !x.played).map((x) => ({ id: x.id, power: x.power }))];
    const res = winChance({
      events: state.events, lanes: state.lanes, turn: state.turn, lastTurn, cards, avgPower,
      oppRows: c.rows.map((r) => ({ id: r.id, pDeck: r.pDeck })), oppSeen: c.seenIds.length, oppHand: handSize(),
      myHand, myDeckLeft: left.filter((id) => !handIds.includes(id)),
      myHandSize: handIds.length ? 0 : Math.max(0, Math.min(7, 3 + state.turn - playedMine.size)),
      energyAt: (t) => (t === state.turn ? energy() : t), runs: 160, seed: state.events.length + state.turn * 7,
    });
    const adv = snapAdvice(res.p);
    $('winBox').innerHTML = `<div class="win ${adv.tone}"><div class="pct tnum">${Math.round(res.p * 100)}%<small>win chance</small></div>
      <div><div class="call">${esc(adv.call)}</div><div class="why">${esc(adv.why)} ${res.runs} playouts to turn ${lastTurn}${handIds.length || myHand.length ? '' : '; mark your hand for a sharper read'}.</div></div></div>`;
    document.querySelectorAll('[data-lanepct]').forEach((el) => { el.textContent = `You win this lane in ${pct(res.lanes[Number(el.dataset.lanepct)].pWin)} of playouts`; });
  }, 120);
}

// ---- Render: game -------------------------------------------------------
function renderHeader(c) {
  $('turn').textContent = state.turn;
  $('energy').textContent = energy();
  $('energyLbl').className = state.energy == null ? 'auto' : '';
  $('hand').textContent = handSize();
  $('handLbl').className = state.hand == null ? 'auto' : '';
  const notes = [];
  if (state.turn === c.mods.lastTurn) notes.push('Final turn: the game ends after this one.');
  if (c.oppEnergy !== energy()) notes.push(`Opponent has ${c.oppEnergy} energy left this turn${c.oppSpent ? ` (${c.oppSpent} spent)` : ' (locations)'}.`);
  if (c.myEnergy !== energy() && (activeDeck() || c.mySpent)) notes.push(`You have ${c.myEnergy} energy left this turn${c.mySpent ? ` (${c.mySpent} spent)` : ' (locations)'}.`);
  if (c.mods.forced.length) notes.push(`All cards must be played at ${locName(c.mods.forced[0])} this turn.`);
  for (const p of c.board.pending) notes.push(`${p.side === 'me' ? 'You' : 'They'}: ${p.label}`);
  for (const n of c.board.notes) notes.push(n);
  $('banner').innerHTML = notes.map((n) => `<div class="banner">${esc(n)}</div>`).join('');
  $('watch').innerHTML = c.watch.slice(0, 2).map((w) => `<div>Watch: <b>${esc(w.r.name)}</b> at ${esc(locName(w.lane))} would swing about ${w.swing} power across the board (${pct(w.r.pNext)} likely next).</div>`).join('');
}

function chipHtml(c, board) {
  const p = board.power(c);
  const base = cards.get(c.id)?.power ?? 0;
  return `<button class="chip ${c.created ? 'created' : ''}" data-chip="${esc(c.uid)}" aria-label="${esc(nameOf(c.id))}, ${p} power">${artHtml(cards.get(c.id)?.art, nameOf(c.id))}<span class="cpw ${p > base ? 'up' : p < base ? 'down' : ''}">${p}</span></button>`;
}

function renderLanes(c) {
  const html = state.lanes.map((lane, i) => {
    const loc = lane.loc && locations.get(lane.loc);
    const fx = locationEffect(lane.loc);
    const b = c.evals[i];
    const t = b.threat;
    const L = c.lanes[i];
    const opp = c.board.active.filter((x) => x.lane === i && x.side === 'opp');
    const me = c.board.active.filter((x) => x.lane === i && x.side === 'me');
    const threatHtml = b.status === 'closed' ? '' : t.cards.length
      ? `Opp could add <b>+${Math.round(t.power)}</b>: ${t.cards.map((x) => esc(x.name)).join(' + ')}${t.cards.some((x) => abilityKind(x.id) === 'unmodelled') ? ' <span class="nm">· some abilities not modelled</span>' : ''}`
      : 'No likely affordable plays here.';
    const notes = b.notes.map((n) => `<br>${esc(n)}`).join('');
    const a = c.answers[i];
    const answer = !a ? '' : `<div class="answer ${a.enough ? '' : 'short'}">${a.enough ? 'Play' : 'Best:'} <b>${a.cards.map((x) => esc(x.name)).join(' + ')}</b> (+${Math.round(a.power)}, ${a.cost}⚡)${a.enough ? '' : ' – not enough'}</div>`;
    return `<div class="lane">
      <button class="loc" data-loc="${i}" aria-label="Set location ${i + 1}">
        ${loc ? `<img src="${ART(loc.art, 240)}" alt="" loading="lazy" onerror="this.remove()">` : ''}
        <span class="loc-txt">${loc ? `<span class="loc-name">${esc(loc.name)}</span>` : `<span class="loc-empty">Location ${i + 1}<br>Tap to set</span>`}</span>
      </button>
      ${loc ? `<div class="loc-fx" title="${esc(loc.ability)}">${esc(fx?.once && lane.used ? 'Next-card effect already used.' : fx?.note || loc.ability || 'No effect.')}</div><div class="side"><span class="badge ${fx?.kind || 'none'}">${KIND_LABEL[fx?.kind || 'none']}</span></div>` : ''}
      <div class="side">
        <div class="total opp"><button class="adj" data-adj="${i}:adjOpp:-1" aria-label="Opponent power −1">−</button><b class="tnum">${L.theirs}</b><button class="adj" data-adj="${i}:adjOpp:1" aria-label="Opponent power +1">+</button></div>
        <div class="chips">${opp.map((x) => chipHtml(x, c.board)).join('')}</div>
      </div>
      <div class="side">
        <div class="chips">${me.map((x) => chipHtml(x, c.board)).join('')}</div>
        <div class="total"><button class="adj" data-adj="${i}:adjMe:-1" aria-label="My power −1">−</button><b class="tnum">${L.mine}</b><button class="adj" data-adj="${i}:adjMe:1" aria-label="My power +1">+</button></div>
      </div>
      <div class="lane-tools">
        ${fx?.once ? `<button class="usedchip ${lane.used ? 'on' : ''}" data-used="${i}">${lane.used ? 'Effect used ✓' : 'Mark effect used'}</button>` : ''}
        <button class="addcard ${fx?.creates ? 'hl' : ''}" data-addcard="${i}">${fx?.creates ? 'What came out?' : '+ Add card'}</button>
      </div>
      <div class="verdict ${b.status}">${esc(b.headline)}<small>${esc(b.sub)}</small></div>
      <div class="lane-pct" data-lanepct="${i}"></div>
      <div class="threat">${threatHtml}${notes}</div>
      ${answer || '<div class="lane-pad"></div>'}
    </div>`;
  });
  $('lanes').innerHTML = html.join('');
}

function renderMyDeck(c) {
  const deck = activeDeck();
  const extraHtml = state.myExtra.map((x) => `<button class="pcard ${x.played ? 'played' : 'hand'}" data-myx="${x.key}" aria-label="${esc(nameOf(x.id))}">${artHtml(cards.get(x.id)?.art, nameOf(x.id))}<span class="lbl">${x.played ? 'Played' : `Created ${x.power}`}</span></button>`).join('');
  if (!deck) {
    $('myDeckHint').textContent = '';
    $('myDeck').innerHTML = (extraHtml ? `<div class="strip mine">${extraHtml}</div>` : '') + `<button class="cta" data-go="decks"><b>Add your deck</b> for your win chance, counter alerts and the best play for each lane.</button>`;
    $('alerts').innerHTML = '';
    return;
  }
  $('myDeckHint').textContent = `${deck.name} · tap to play or mark in hand`;
  const st = (id) => (c.playedMine.has(id) ? 'played' : state.mine[id] === 'hand' ? 'hand' : 'deck');
  $('myDeck').innerHTML = `<div class="strip mine">${deck.cards.map((id) => {
    const card = cards.get(id);
    return `<button class="pcard ${st(id)}" data-mine="${id}" aria-label="${esc(nameOf(id))}: ${st(id)}">${artHtml(card?.art, nameOf(id))}<span class="lbl">${st(id) === 'hand' ? 'In hand' : st(id) === 'played' ? 'Played' : esc(nameOf(id))}</span></button>`;
  }).join('')}${extraHtml}</div>`;
  const remaining = deck.cards.filter((id) => st(id) !== 'played');
  const alerts = counterAlerts(remaining, c.seenIds, c.rows, cards);
  $('alerts').innerHTML = alerts.map((a) => {
    const card = cards.get(a.id);
    const targets = a.onBoard.length ? `On board: ${a.onBoard.map((x) => esc(x.name)).join(', ')}` : `Likely: ${a.likely.map((x) => `${esc(x.name)} ${pct(x.pDeck)}`).join(', ')}`;
    return `<div class="alert">${artHtml(card?.art, card?.name ?? a.id)}<span><b>${esc(card?.name ?? a.id)}</b> ${esc(a.why)}<small>${targets}</small></span><span class="p tnum">${a.onBoard.length ? 'Now' : pct(a.pAny)}</span></div>`;
  }).join('');
}

function renderPlayed() {
  const ev = oppDeckEvents();
  $('playedCount').textContent = `${ev.length}/12`;
  $('played').innerHTML = ev.length
    ? ev.map((e) => `<button class="pcard" data-unevent="${e.uid}" aria-label="Remove ${esc(nameOf(e.id))}">${artHtml(cards.get(e.id)?.art, nameOf(e.id))}<span class="lbl">${esc(nameOf(e.id))}${e.t === 'log' ? ' ·?' : ''}</span><i>✕</i></button>`).reverse().join('')
    : '<div class="empty">Tap a card below as your opponent plays it, then tap where it went.</div>';

function renderList(c) {
  const rows = c.rows;
  const key = { deck: 'pDeck', hand: 'pHand', next: 'pNext' }[state.sort];
  const label = { deck: 'in deck', hand: 'in hand', next: 'next play' }[state.sort];
  rows.sort((a, b) => b[key] - a[key] || b.pDeck - a.pDeck);
  for (const b of $('sortTabs').children) b.setAttribute('aria-pressed', String(b.dataset.sort === state.sort));
  $('matchInfo').textContent = !c.seenIds.length
    ? 'Most-played cards in the current meta. Tap one when the opponent plays it.'
    : c.alpha > 0.05 ? `Matches a known deck (${Math.round(c.alpha * 100)}% weight) plus card co-occurrence.` : 'Based on cards that appear alongside what you’ve seen.';
  const limit = state.showAll ? 60 : 20;
  $('list').innerHTML = rows.slice(0, limit).map((r) => `<button class="row" data-add="${r.id}">
      ${artHtml(r.art, r.name)}
      <span style="min-width:0">
        <span class="nm-line"><b>${esc(r.name)}</b><span class="cp"><span class="cost ${r.cost !== r.baseCost ? 'mod' : ''}">${r.cost}</span><span class="pow">${r.power}</span></span></span>
        <span class="sub tnum"><span>${pct(r.pDeck)} deck</span><span>${pct(r.pHand)} hand</span>${abilityKind(r.id) === 'unmodelled' ? '<span class="nm">Ability not modelled</span>' : ''}</span>
        <span class="bar"><i style="width:${Math.min(100, Math.round(r[key] * 100))}%"></i></span>
      </span>
      <span class="big tnum"><b>${pct(r[key])}</b><small>${label}</small></span>
    </button>`).join('');
  $('more').hidden = rows.length <= 20;
  $('more').textContent = state.showAll ? 'Show fewer' : `Show more (${Math.min(rows.length, 60) - 20})`;
}

function renderSearch() {
  const q = $('search').value.trim().toLowerCase();
  if (!q) { $('results').innerHTML = ''; return; }
  const seen = new Set(oppDeckEvents().map((e) => e.id));
  $('results').innerHTML = searchCards(q, seen).map((c) => resHtml(c, 'add')).join('') || '<div class="empty">No card matches.</div>';
}
const searchCards = (q, exclude) => cardData.cards
  .filter((c) => !exclude.has(c.id) && c.name.toLowerCase().includes(q))
  .sort((a, b) => (a.generated ? 1 : 0) - (b.generated ? 1 : 0) || a.name.toLowerCase().indexOf(q) - b.name.toLowerCase().indexOf(q))
  .slice(0, 12);
const resHtml = (c, attr) => `<button class="res" data-${attr}="${c.id}">${artHtml(c.art, c.name)}<span><b>${esc(c.name)}</b><small>${c.cost} cost · ${c.power} power${c.generated ? ' · generated' : ''}</small></span></button>`;

// ---- Render: decks ------------------------------------------------------
let editing = null;
function renderDecks() {
  $('deckEditor').hidden = !editing;
  $('deckList').hidden = !!editing;
  $('newDeck').hidden = !!editing;
  if (editing) return renderEditor();
  $('deckList').innerHTML = decks.list.length ? decks.list.map((d) => `<div class="deck ${d.id === decks.active ? 'active' : ''}">
      <div class="deck-hd"><b>${esc(d.name)}</b>${d.id === decks.active ? '<span class="badge">In use</span>' : ''}<span class="note" style="margin:0 0 0 auto">${d.cards.length}/12</span></div>

        <button class="btn" data-edit="${d.id}">Edit</button>
        <button class="btn" data-copy="${d.id}">Copy code</button>
        <button class="btn danger" data-del="${d.id}">Delete</button>

function counterSummary(d) {

  return tech.length ? `<p class="note">Counters Scout will watch for: ${tech.map((id) => `${esc(nameOf(id))} (${esc(COUNTERS[id].why)})`).join('; ')}.</p>` : '';
}
function modelSummary(d) {
  const un = d.cards.filter((id) => abilityKind(id) === 'unmodelled');
  return un.length ? `<p class="note">Abilities not modelled yet (printed Power used): ${un.map((id) => esc(nameOf(id))).join(', ')}.</p>` : '';
}
function renderEditor() {
  $('slotCount').textContent = `${editing.cards.length}/12`;
  $('slots').innerHTML = Array.from({ length: 12 }, (_, i) => {
    const id = editing.cards[i];
    if (!id) return '<div class="slot"></div>';
    return `<button class="slot" data-unslot="${i}" aria-label="Remove ${esc(nameOf(id))}">${artHtml(cards.get(id)?.art, nameOf(id))}<span class="slot-name">${esc(nameOf(id))}</span><i>✕</i></button>`;
  }).join('');

  $('deckResults').innerHTML = q ? searchCards(q, new Set(editing.cards)).filter((c) => !c.generated).map((c) => resHtml(c, 'slot')).join('') || '<div class="empty">No card matches.</div>' : '';

function render() {
  $('gameView').hidden = view !== 'game';
  $('decksView').hidden = view !== 'decks';
  $('gameHdr').hidden = view !== 'game';
  $('decksHdr').hidden = view !== 'decks';
  for (const [id, v] of [['tabGame', 'game'], ['tabDecks', 'decks']]) {
    if (view === v) $(id).setAttribute('aria-current', 'page'); else $(id).removeAttribute('aria-current');
  }
  if (view === 'decks') renderDecks();
  else {
    const c = compute();
    renderHeader(c);
    renderLanes(c);
    renderMyDeck(c);
    renderPlayed();
    renderList(c);
    renderSearch();
    scheduleWin(c);
    $('footer').innerHTML = `${deckData.decks.length.toLocaleString()} decklists (${esc(deckData.source)}), cards and locations from Marvel Snap Zone, fetched ${esc(deckData.fetched)}.<br>Lane totals are worked out from the cards on the board with their abilities and the locations; use − / + to correct anything Scout doesn’t model. The win chance plays the game out from here many times and is a guide, not a guarantee. Your saved decks stay on this device.`;
  }
  save();
}

// ---- Toast / undo -------------------------------------------------------
let undoState = null, toastTimer;
function toast(msg, prev) {
  undoState = prev || null;
  $('undo').hidden = !prev;
  $('toastMsg').textContent = msg;
  $('toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 3500);
}
$('undo').addEventListener('click', () => {
  if (undoState) { ({ state, decks } = undoState); undoState = null; render(); }
  $('toast').classList.remove('show');
});
const snapshot = () => JSON.parse(JSON.stringify({ state, decks }));

// Remove an event and everything that refers to the card it made.
function removeEvent(uid) {
  state.events = state.events.filter((e) => e.uid !== uid && !(e.t !== 'play' && e.t !== 'add' && e.t !== 'log' && String(e.uid).startsWith(uid)));
}

// ---- Action sheet: place / move / edit -----------------------------------
const act = { kind: null, id: null, uid: null, side: null };
function laneButtons(prefix, current, side) {
  const c = compute();
  return `<div class="act-row">${[0, 1, 2].map((i) => {
    const L = c.lanes[i];
    const full = (side === 'opp' ? L.oppCards : L.myCards) >= 4;
    return `<button class="btn ${i === current ? '' : 'primary'}" data-${prefix}="${i}" ${i === current || full ? 'disabled' : ''}>${esc(locName(i))}<small>${full ? 'full' : `${L.mine} – ${L.theirs}`}</small></button>`;
  }).join('')}</div>`;
}
function openPlace(side, id) {
  Object.assign(act, { kind: 'place', side, id, uid: null });
  const c = cards.get(id);
  $('actTitle').textContent = side === 'opp' ? 'Where did they play it?' : 'Where are you playing it?';
  const handTxt = state.mine[id] === 'hand' ? 'Not in my hand' : 'Mark in my hand';
  $('actBody').innerHTML = `<div class="act-card">${artHtml(c?.art, nameOf(id))}<div><b>${esc(nameOf(id))}</b> <span class="cp"><span class="cost">${c?.cost ?? '?'}</span><span class="pow">${c?.power ?? '?'}</span></span><p>${esc(abilityNote(id))}</p></div></div>
    ${laneButtons('placeat', null, side)}
    ${side === 'opp' ? '<button class="btn" data-placeat="log" style="width:100%">Seen, but don’t place it</button>' : `<button class="btn" data-toggleHand="1" style="width:100%">${handTxt}</button>`}`;
  $('actSheet').showModal();
}
function openChip(uid) {
  const c = compute();
  const card = c.board.cards.find((x) => x.uid === uid);
  if (!card) return;
  Object.assign(act, { kind: 'chip', uid, id: card.id, side: card.side });
  const info = cards.get(card.id);
  const evt = state.events.find((e) => e.uid === uid);
  $('actTitle').textContent = `${card.side === 'opp' ? 'Their' : 'Your'} ${nameOf(card.id)}`;
  $('actBody').innerHTML = `<div class="act-card">${artHtml(info?.art, nameOf(card.id))}<div><b>${esc(nameOf(card.id))}</b> at ${esc(locName(card.lane))}${card.created ? ' · created' : ''}<p>${esc(abilityNote(card.id))}${card.moves ? ` Moved ${plural(card.moves, 'time')}.` : ''}</p></div></div>
    <div class="act-label">Moved to</div>
    ${laneButtons('moveto', card.lane, card.side)}
    <div class="act-label">Power</div>
    <div class="pw-edit"><button class="btn" data-buff="-1">−1</button><b class="tnum">${c.board.power(card)}</b><button class="btn" data-buff="1">+1</button><button class="btn" data-buff="5">+5</button></div>
    <div class="act-label">Other</div>
    <div class="deck-actions"><button class="btn danger" data-kill="1">Destroyed</button>${evt ? '<button class="btn" data-remove-ev="1">Remove (entered by mistake)</button>' : ''}</div>`;
  $('actSheet').showModal();
}
$('actClose').addEventListener('click', () => $('actSheet').close());
$('actSheet').addEventListener('click', (e) => {
  if (e.target === $('actSheet')) return $('actSheet').close();
  const t = e.target.closest('button');
  if (!t || t.disabled) return;
  const d = t.dataset;
  const prev = snapshot();
  if (d.placeat !== undefined) {
    const uid = newUid();
    if (d.placeat === 'log') state.events.push({ t: 'log', uid, side: act.side, id: act.id, turn: state.turn });
    else {
      state.events.push({ t: 'play', uid, side: act.side, id: act.id, lane: Number(d.placeat), turn: state.turn });
      if (act.side === 'me') delete state.mine[act.id];
    }
    const lane = d.placeat === 'log' ? '' : ` at ${locName(Number(d.placeat))}`;
    toast(`${act.side === 'opp' ? 'They' : 'You'} played ${nameOf(act.id)}${lane}`, prev);
    $('search').value = '';
  } else if (d.togglehand) {
    if (state.mine[act.id] === 'hand') delete state.mine[act.id]; else state.mine[act.id] = 'hand';
  } else if (d.moveto !== undefined) {
    state.events.push({ t: 'move', uid: act.uid, lane: Number(d.moveto), turn: state.turn });
    toast(`${nameOf(act.id)} moved to ${locName(Number(d.moveto))}`, prev);
  } else if (d.buff) {
    state.events.push({ t: 'buff', uid: act.uid, delta: Number(d.buff) });
    render();
    return openChip(act.uid);
  } else if (d.kill) {
    state.events.push({ t: 'destroy', uid: act.uid, turn: state.turn });
    toast(`${nameOf(act.id)} destroyed`, prev);
  } else if (d.removeEv) {
    removeEvent(act.uid);
    toast(`Removed ${nameOf(act.id)}`, prev);
  } else return;
  $('actSheet').close();
  render();
});

// ---- Location sheet -----------------------------------------------------
let sheetLane = 0;
function openSheet(i) {
  sheetLane = i;
  $('locSheetTitle').textContent = `Location ${i + 1}`;
  $('locSearch').value = '';
  renderLocList();
  $('locSheet').showModal();
}
function renderLocList() {
  const q = $('locSearch').value.trim().toLowerCase();
  const list = locData.locations.filter((l) => !q || l.name.toLowerCase().includes(q) || l.ability.toLowerCase().includes(q)).slice(0, 60);
  $('locList').innerHTML = list.map((l) => {
    const fx = locationEffect(l.id);
    return `<button class="lrow" data-pick="${l.id}">${artHtml(l.art, l.name)}<span><b>${esc(l.name)}</b> <span class="badge ${fx?.kind || 'none'}">${KIND_LABEL[fx?.kind || 'none']}</span><p>${esc(l.ability)}</p></span></button>`;
  }).join('') || '<div class="empty">No location matches.</div>';
}
$('locSearch').addEventListener('input', renderLocList);
$('locClose').addEventListener('click', () => $('locSheet').close());
$('locClear').addEventListener('click', () => { state.lanes[sheetLane].loc = null; $('locSheet').close(); render(); });
$('locSheet').addEventListener('click', (e) => {
  if (e.target === $('locSheet')) return $('locSheet').close();
  const b = e.target.closest('[data-pick]');
  if (!b) return;
  state.lanes[sheetLane].loc = b.dataset.pick;
  state.lanes[sheetLane].used = false;
  $('locSheet').close();
  render();
});

// ---- Add-card sheet: created, transformed or random cards ----------------
const sheet = { lane: 0, side: 'opp', filterOn: false, sel: null, creates: null };
function openCardSheet(i) {
  const lane = state.lanes[i];
  const fx = state.turn >= i + 1 ? locationEffect(lane.loc) : null;
  sheet.lane = i;
  sheet.creates = fx?.creates || null;
  sheet.side = sheet.creates?.sides[0] || 'opp';
  sheet.filterOn = !!sheet.creates?.filter;
  sheet.sel = null;
  $('cardSheetTitle').textContent = sheet.creates?.ask || `Add a card at ${locName(i)}`;
  $('cardFilter').hidden = !sheet.creates?.filter;
  $('cardFilter').textContent = sheet.creates?.hint ? `Only ${sheet.creates.hint}` : '';
  $('cardSearch').value = '';
  $('cardPower').value = '';
  renderCardSheet();
  $('cardSheet').showModal();
}
function renderCardSheet() {
  for (const b of $('cardSides').children) b.setAttribute('aria-pressed', String(b.dataset.cside === sheet.side));
  $('cardFilter').setAttribute('aria-pressed', String(sheet.filterOn));
  const q = $('cardSearch').value.trim().toLowerCase();
  const f = sheet.filterOn && sheet.creates?.filter;
  const list = cardData.cards
    .filter((c) => (!f || f(c)) && (!q || c.name.toLowerCase().includes(q)))
    .sort((a, b) => (q ? a.name.toLowerCase().indexOf(q) - b.name.toLowerCase().indexOf(q) : 0) || (a.generated ? 1 : 0) - (b.generated ? 1 : 0) || a.name.localeCompare(b.name))
    .slice(0, 60);
  $('cardList').innerHTML = list.map((c) => resHtml(c, 'pickcard').replace('class="res"', `class="res ${sheet.sel === c.id ? 'sel' : ''}"`)).join('') || '<div class="empty">No card matches.</div>';
  const c = sheet.sel && cards.get(sheet.sel);
  $('cardSel').textContent = c ? c.name : 'Pick a card';
  $('cardAdd').disabled = !c;
  $('cardAdd').textContent = sheet.side === 'hand' ? 'Add to hand' : 'Add';
}
$('cardSearch').addEventListener('input', renderCardSheet);
$('cardClose').addEventListener('click', () => $('cardSheet').close());
$('cardSheet').addEventListener('click', (e) => {
  if (e.target === $('cardSheet')) return $('cardSheet').close();
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.cside) sheet.side = t.dataset.cside;
  else if (t.id === 'cardFilter') sheet.filterOn = !sheet.filterOn;
  else if (t.dataset.pickcard) {
    sheet.sel = t.dataset.pickcard;
    $('cardPower').value = cards.get(sheet.sel)?.power ?? 0;
  } else if (t.id === 'cardAdd' && sheet.sel) {
    const prev = snapshot();
    const power = Number($('cardPower').value) || 0;
    const name = nameOf(sheet.sel);
    if (sheet.side === 'hand') {
      state.myExtra.push({ key: newUid(), id: sheet.sel, power });
      toast(`${name} added to your hand`, prev);
    } else {
      const lane = state.lanes[sheet.lane];
      state.events.push({ t: 'add', uid: newUid(), side: sheet.side, id: sheet.sel, lane: sheet.lane, turn: state.turn, power });
      if (locationEffect(lane.loc)?.once) lane.used = true;
      toast(`${name} (${power}) on ${sheet.side === 'opp' ? 'their' : 'your'} side`, prev);
    }
    $('cardSheet').close();
    render();
    return;
  } else return;
  renderCardSheet();
});

// ---- Events -------------------------------------------------------------
document.body.addEventListener('click', (e) => {
  const t = e.target.closest('button');
  if (!t || t.closest('dialog') || t.id === 'undo') return;
  const d = t.dataset;
  if (t.id === 'tabGame' || d.go === 'game') { view = 'game'; editing = null; }
  else if (t.id === 'tabDecks' || d.go === 'decks') { view = 'decks'; if (!decks.list.length) startEdit(); }
  else if (d.add) {
    if (oppDeckEvents().length >= 12) return toast('Opponent already has 12 cards seen.');
    return openPlace('opp', d.add);
  } else if (d.mine) {
    const ev = myPlays().find((x) => x.id === d.mine);
    if (ev) return openChip(ev.uid);
    return openPlace('me', d.mine);
  } else if (d.myx) {
    const x = state.myExtra.find((y) => y.key === d.myx);
    if (!x) return;
    if (x.played) { const prev = snapshot(); state.myExtra = state.myExtra.filter((y) => y !== x); toast(`Removed ${nameOf(x.id)}`, prev); }
    else return openPlaceExtra(x);
  } else if (d.chip) return openChip(d.chip);
  else if (d.unevent) { const prev = snapshot(); const ev = state.events.find((x) => x.uid === d.unevent); removeEvent(d.unevent); toast(`Removed ${nameOf(ev?.id)}`, prev); }
  else if (d.adj) {
    const [i, key, delta] = d.adj.split(':');
    state.lanes[i][key] += Number(delta);
  } else if (d.addcard !== undefined) return openCardSheet(Number(d.addcard));
  else if (d.used !== undefined) state.lanes[d.used].used = !state.lanes[d.used].used;
  else if (d.step) {
    const [k, delta] = d.step.split(':');
    const n = Number(delta);
    if (k === 'turn') { state.turn = Math.min(7, Math.max(1, state.turn + n)); state.energy = null; state.hand = null; }
    else if (k === 'energy') state.energy = Math.min(15, Math.max(0, energy() + n));
    else state.hand = Math.min(7, Math.max(0, handSize() + n));
  } else if (d.loc !== undefined) return openSheet(Number(d.loc));
  else if (d.sort) state.sort = d.sort;
  else if (t.id === 'more') state.showAll = !state.showAll;
  else if (t.id === 'reset') {
    const prev = snapshot();
    state = { ...fresh(), sort: state.sort };
    toast('New game', prev);
  }
  // Decks
  else if (t.id === 'newDeck') startEdit();
  else if (d.edit) startEdit(decks.list.find((x) => x.id === d.edit));
  else if (d.use) { decks.active = d.use; state.mine = {}; toast('Deck in use for the next game'); }
  else if (d.copy) {
    const deck = decks.list.find((x) => x.id === d.copy);
    navigator.clipboard?.writeText(deckCode(deck.cards)).then(() => toast('Deck code copied'), () => toast('Couldn’t copy; try again'));
  } else if (d.del) {
    const prev = snapshot();
    decks.list = decks.list.filter((x) => x.id !== d.del);
    if (decks.active === d.del) decks.active = decks.list[0]?.id || null;
    toast('Deck deleted', prev);
  } else if (d.slot) { if (editing.cards.length < 12) editing.cards.push(d.slot); $('deckSearch').value = ''; }
  else if (d.unslot !== undefined) editing.cards.splice(Number(d.unslot), 1);
  else if (t.id === 'importDeck') {
    const r = parseDeck($('deckPaste').value, cardData.cards);
    if (!r.cards.length) { $('importNote').className = 'note err'; $('importNote').textContent = 'Couldn’t read that. Paste the code from Marvel Snap’s Copy button, or card names one per line.'; return; }
    editing.cards = r.cards;
    if (r.name && !$('deckName').value) $('deckName').value = r.name;
    $('importNote').className = r.unknown.length ? 'note err' : 'note';
    $('importNote').textContent = `Imported ${plural(r.cards.length, 'card')}.${r.unknown.length ? ` Not recognised: ${r.unknown.join(', ')}.` : ''}`;
    $('deckPaste').value = '';
  } else if (t.id === 'saveDeck') {
    if (!editing.cards.length) { $('importNote').className = 'note err'; $('importNote').textContent = 'Add at least one card first.'; return; }
    const name = $('deckName').value.trim() || `Deck ${decks.list.length + 1}`;
    const deck = { id: editing.id || `d${Date.now().toString(36)}`, name, cards: editing.cards };
    const i = decks.list.findIndex((x) => x.id === deck.id);
    if (i >= 0) decks.list[i] = deck; else decks.list.push(deck);
    if (!decks.active || !decks.list.some((x) => x.id === decks.active)) decks.active = deck.id;
    editing = null;
    toast(`Saved ${name}`);
  } else if (t.id === 'cancelDeck') editing = null;
  else return;
  render();
});

// Created cards in my hand: play them like any other card.
function openPlaceExtra(x) {
  Object.assign(act, { kind: 'place', side: 'me', id: x.id, uid: null });
  $('actTitle').textContent = 'Where are you playing it?';
  $('actBody').innerHTML = `<div class="act-card">${artHtml(cards.get(x.id)?.art, nameOf(x.id))}<div><b>${esc(nameOf(x.id))}</b> · ${x.power} power<p>Created card in your hand.</p></div></div>${laneButtons('playx', null, 'me')}`;
  $('actSheet').showModal();
  $('actBody').onclick = (e) => {
    const t = e.target.closest('[data-playx]');
    if (!t || t.disabled) return;
    const prev = snapshot();
    state.events.push({ t: 'add', uid: newUid(), side: 'me', id: x.id, lane: Number(t.dataset.playx), turn: state.turn, power: x.power });
    x.played = true;
    toast(`You played ${nameOf(x.id)}`, prev);
    $('actBody').onclick = null;
    $('actSheet').close();
    render();
  };
}
$('actSheet').addEventListener('close', () => { $('actBody').onclick = null; });

function startEdit(deck) {
  editing = deck ? { id: deck.id, cards: [...deck.cards] } : { id: null, cards: [] };
  $('deckName').value = deck?.name || '';
  $('deckPaste').value = '';
  $('deckSearch').value = '';
  $('importNote').textContent = '';
}
$('search').addEventListener('input', renderSearch);
$('deckSearch').addEventListener('input', renderEditor);
render();
</script>
</body>
